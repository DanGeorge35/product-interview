name: CI

on:
  push:
    branches: ["main", "develop"]
  pull_request:
    branches: ["main", "develop"]

env:
  DOTNET_VERSION: "8.0.x"
  NODE_VERSION: "22.x"

jobs:
  # ── Backend ──────────────────────────────────────────────────────────────────
  backend:
    name: Backend — Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore dependencies
        run: dotnet restore ProductService.sln

      - name: Build
        run: dotnet build ProductService.sln --no-restore --configuration Release

      - name: Run unit tests
        run: |
          dotnet test tests/ProductService.UnitTests/ProductService.UnitTests.csproj \
            --no-build \
            --configuration Release \
            --logger "trx;LogFileName=unit-test-results.trx" \
            --collect:"XPlat Code Coverage" \
            --results-directory ./test-results

      - name: Run integration tests
        run: |
          dotnet test tests/ProductService.IntegrationTests/ProductService.IntegrationTests.csproj \
            --no-build \
            --configuration Release \
            --logger "trx;LogFileName=integration-test-results.trx" \
            --results-directory ./test-results

      - name: Publish test results
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: .NET Test Results
          path: test-results/*.trx
          reporter: dotnet-trx

      - name: Upload coverage report
        uses: codecov/codecov-action@v4
        if: always()
        with:
          files: test-results/**/coverage.cobertura.xml
          fail_ci_if_error: false

  # ── Frontend ─────────────────────────────────────────────────────────────────
  frontend:
    name: Frontend — Build & Type-check
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build
        env:
          VITE_API_URL: https://placeholder.azurewebsites.net/api
